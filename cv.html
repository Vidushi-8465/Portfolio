<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi Bhardwaj - CV</title>
    <meta name="description" content="Vidushi Bhardwaj - AI/ML Developer Portfolio - CV">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Additional CV page styles */
        body {
            overflow: hidden;
        }
        
        .cv-section {
            min-height: 100vh;
            padding-top: 90px;
            padding-bottom: 0;
        }
        
        .return-btn {
            position: fixed;
            top: 6rem;
            left: 2rem;
            z-index: 100;
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            color: var(--accent-blue);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .return-btn:hover {
            background: var(--accent-blue);
            color: white;
            transform: translateX(-5px);
        }
        
        .cv-container {
            max-width: 100%;
            width: 100%;
            height: calc(100vh - 90px);
            margin: 0;
            padding: 0 2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
        }
        
        .section-header {
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }
        
        .section-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .cv-viewer {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 149, 237, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .cv-iframe-container {
            width: 100%;
            flex: 1;
            border-radius: 12px;
            overflow: auto;
            background: white;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
        }
        
        .download-section {
            margin-top: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
        
        footer {
            display: none;
        }
        
        @media (max-width: 768px) {
            .return-btn {
                top: 5rem;
                left: 1rem;
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }
            
            .cv-container {
                padding: 0 1rem 1rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <div class="logo">VIDUSHI</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Return Button -->
    <a href="index.html" class="return-btn">
        <i class="fas fa-arrow-left"></i>
        Return Back
    </a>

    <!-- CV Section -->
    <section class="cv-section">
        <div class="cv-container">
            <div class="section-header">
                <div class="section-label">Resume</div>
                <h2>My CV</h2>
            </div>
            
            <div class="cv-viewer">
                <div class="cv-iframe-container">
                    <iframe 
                        src="Vidushi Bhardwaj.pdf" 
                        title="Vidushi Bhardwaj CV">
                        <p>Your browser does not support PDFs. 
                        <a href="Vidushi Bhardwaj.pdf" download>Download the PDF</a> instead.</p>
                    </iframe>
                </div>
                
                <div class="download-section">
                    <a href="Vidushi Bhardwaj.pdf" download class="btn btn-primary">
                        <i class="fas fa-download"></i>
                        Download CV
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> Vidushi Bhardwaj. All rights reserved.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/vidushi-bhardwaj05" target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://github.com/Vidushi-8465" target="_blank">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://leetcode.com/vidushi_8465" target="_blank">
                    <i class="fas fa-code"></i>
                </a>
                <a href="https://instagram.com/v1dush1_2005" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
